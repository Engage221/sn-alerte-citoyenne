<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carte OpenStreetMap + Firebase</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+e2g3QYw8o5Cqz8hGZ2WvC1qf5k3QZf2R9F8kRo3k="
    crossorigin=""
  />

  <style>
    /* Assure-toi que #map a une hauteur visible */
    html,body { height: 100%; margin: 0; }
    #map { height: 100vh; min-height: 400px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o9N1jz6I6sGQk3lQmy3b7q6vCtmkV+Xk2f7fuyQmRqo="
    crossorigin=""
  ></script>

  <!-- App JS (modulaire pour Firebase v9+) -->
  <script type="module" src="./app.js"></script>
</body>
</html>
